name: shiguang-website

services:
  website:
    image: ghcr.io/shiguang-lab/website:${WEBSITE_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${WEBSITE_BIND_IP:?Set WEBSITE_BIND_IP}:${WEBSITE_PORT:-3400}:8080"
    volumes:
      - ${WEBSITE_DOWNLOADS_DIR:-./downloads}:/usr/share/nginx/html/downloads:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
