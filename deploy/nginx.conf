user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;
  absolute_redirect off;
  port_in_redirect off;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
      try_files /index.html =404;
    }

    location /assets/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location /downloads/ {
      try_files $uri =404;
    }

    location ~ ^/plasmic-updates/(darwin/universal|win32/x64|linux/x64)/([A-Za-z0-9._-]+)$ {
      limit_except GET { deny all; }
      resolver 127.0.0.11 valid=60s ipv6=off;
      proxy_pass https://studio.plasmic.shiguanglab.com/desktop-updates/$1/$2;
      proxy_set_header Host studio.plasmic.shiguanglab.com;
      proxy_set_header Cookie "";
      proxy_set_header Authorization "";
      proxy_ssl_server_name on;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 4;
      proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
      proxy_hide_header Set-Cookie;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "no-store" always;
    }

    location / {
      try_files $uri/index.html $uri /app.html;
    }
  }
}
